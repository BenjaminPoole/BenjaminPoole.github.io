<svg width="100%" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Inference loop: student predicts action, simulator executes, repeat until done</title>
<desc>Steps 1-2 repeat each turn. No teacher, no retries. Single episode per task.</desc>

<style>
  svg { font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; }
  .mono { font-family: ui-monospace, monospace; font-size: 12px; }
  .label { font-size: 14px; font-weight: 500; fill: #141413; }
  .sublabel { font-size: 12px; fill: #5f5e5a; }
  .dim { fill: #3d3d3a; }
  .box-neutral { fill: #f1efe8; stroke: #5f5e5a; stroke-width: 0.5; }
  .box-purple  { fill: #eeedfe; stroke: #534ab7; stroke-width: 0.5; }
  .box-blue    { fill: #e6f1fb; stroke: #185fa5; stroke-width: 0.5; }
  .box-bg      { fill: #f5f4ed; stroke: rgba(31,30,29,0.3); stroke-width: 0.5; }
  .box-green   { fill: #eaf3de; stroke: #3b6d11; stroke-width: 0.5; }
  .box-darkred { fill: #fcebeb; stroke: #a32d2d; stroke-width: 0.5; }
  .arrow       { fill: none; stroke: #737270; stroke-width: 1.5; opacity: 0.5; }
  .connector   { fill: none; stroke: #737270; stroke-width: 0.5; opacity: 0.4; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-lg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <clipPath id="img-clip"><rect x="164" y="82" width="100" height="100" rx="6"/></clipPath>
</defs>

<!-- ====== TOP LABEL ====== -->
<text x="340" y="24" text-anchor="middle" class="sublabel" opacity=".7" font-style="italic">single episode per task (no retries)</text>

<!-- ====== INNER TURN LOOP ====== -->
<g transform="translate(0,30)">

<text x="340" y="30" text-anchor="middle" class="sublabel" opacity=".65" font-style="italic">each turn:</text>

<!-- ======== STAGE 1 ======== -->
<text x="46" y="68" class="label">1. Student predicts action</text>

<g>
  <rect x="46" y="82" width="100" height="100" rx="6" class="box-neutral"/>
  <text x="96" y="104" text-anchor="middle" class="sublabel">system prompt</text>
  <text x="96" y="122" text-anchor="middle" class="sublabel">learned heuristics</text>
  <text x="96" y="140" text-anchor="middle" class="sublabel">context</text>
  <text x="96" y="158" text-anchor="middle" class="sublabel">observation</text>
</g>

<text x="155" y="135" text-anchor="middle" opacity=".6" class="sublabel">+</text>

<image href="turn_001.jpg" x="164" y="82" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#img-clip)"/>

<line x1="264" y1="132" x2="298" y2="132" marker-end="url(#arrow)" class="arrow"/>

<g>
  <rect x="298" y="108" width="110" height="48" rx="8" class="box-purple"/>
  <text x="353" y="134" text-anchor="middle" dominant-baseline="central" class="label" fill="#3c3489">student</text>
</g>

<line x1="408" y1="132" x2="478" y2="132" marker-end="url(#arrow)" class="arrow"/>
<text x="443" y="122" text-anchor="middle" opacity=".7" font-style="italic" class="sublabel">append</text>

<g>
  <rect x="478" y="112" width="152" height="40" rx="6" class="box-neutral"/>
  <text x="554" y="135" text-anchor="middle" dominant-baseline="central" class="mono sublabel">navigate_to(...)</text>
</g>

<!-- ======== STAGE 2 ======== -->
<line x1="554" y1="152" x2="554" y2="200" class="connector"/>
<line x1="554" y1="200" x2="46"  y2="200" class="connector"/>
<line x1="46"  y1="200" x2="46"  y2="226" marker-end="url(#arrow)" class="arrow" opacity=".4"/>

<text x="46" y="246" class="label">2. Simulator executes action</text>

<g>
  <rect x="46" y="260" width="140" height="36" rx="6" class="box-neutral"/>
  <text x="116" y="281" text-anchor="middle" dominant-baseline="central" class="mono sublabel">navigate_to(...)</text>
</g>

<line x1="186" y1="278" x2="216" y2="278" marker-end="url(#arrow)" class="arrow"/>

<g>
  <rect x="216" y="256" width="110" height="44" rx="8" class="box-blue"/>
  <text x="271" y="280" text-anchor="middle" dominant-baseline="central" class="label" fill="#0c447c">simulator</text>
</g>

<line x1="326" y1="278" x2="388" y2="278" marker-end="url(#arrow)" class="arrow"/>
<text x="357" y="268" text-anchor="middle" opacity=".7" font-style="italic" class="sublabel">append</text>

<rect x="388" y="256" width="250" height="150" rx="6" class="box-bg"/>
<text x="402" y="275" class="mono dim">SUCCESS</text>
<text x="402" y="291" class="mono dim" opacity=".7">Navigated to</text>
<text x="402" y="307" class="mono dim" opacity=".7">  radio_89 (0.3m away)</text>
<text x="402" y="327" class="mono dim" opacity=".5">---</text>
<text x="402" y="347" class="mono dim" opacity=".7">Objects visible in 360° (75):</text>
<text x="402" y="363" class="mono dim" opacity=".7">radio_89 (0.3m)</text>
<text x="402" y="379" class="mono dim" opacity=".7">coffee_table_koagbh_0 (1.8m)</text>
<text x="402" y="391" class="mono dim" opacity=".5">...</text>

<!-- ======== EXIT CONDITIONS ======== -->
<line x1="513" y1="406" x2="513" y2="430" class="connector"/>
<line x1="513" y1="430" x2="340" y2="430" class="connector"/>
<line x1="340" y1="430" x2="340" y2="448" marker-end="url(#arrow)" class="arrow" opacity=".4"/>

<text x="340" y="468" text-anchor="middle" opacity=".7" class="sublabel">until</text>

<g>
  <rect x="194" y="480" width="80" height="26" rx="5" class="box-green"/>
  <text x="234" y="496" text-anchor="middle" class="mono" fill="#3b6d11">finish()</text>
</g>
<text x="282" y="496" opacity=".6" class="sublabel">or</text>
<g>
  <rect x="302" y="480" width="72" height="26" rx="5" class="box-darkred"/>
  <text x="338" y="496" text-anchor="middle" class="mono" fill="#a32d2d">stuck()</text>
</g>
<text x="382" y="496" opacity=".6" class="sublabel">or </text>
<g>
  <rect x="402" y="480" width="100" height="26" rx="5" class="box-neutral"/>
  <text x="452" y="496" text-anchor="middle" class="mono dim">max turns</text>
</g>

<!-- Inner loop annotation -->
<text x="340" y="526" text-anchor="middle" opacity=".55" class="sublabel" font-style="italic">steps 1–2 repeat each turn</text>

</g>
<!-- ====== END INNER TURN LOOP ====== -->

</svg>
